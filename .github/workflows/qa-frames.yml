# Vorübergehend: erzeugt Filmstreifen aus den Hero-Videos zur Qualitätskontrolle
name: QA-Filmstreifen
on:
  push:
    paths: ['.qa/request']
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          for v in */media/hero.mp4; do
            ffmpeg -nostdin -loglevel error -y -i "$v" -vf "fps=1,scale=480:-1,tile=5x1" -frames:v 1 ".qa/$(dirname "$(dirname "$v")").jpg"
            ffprobe -v error -show_entries format=duration:stream=width,height -of csv=p=0 "$v" >> .qa/info.txt
          done
          git config user.name "github-actions[bot]"; git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add .qa && git commit -m "QA-Filmstreifen" && git push
