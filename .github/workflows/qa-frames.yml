# Vorübergehend: macht die Hero-Videos zu nahtlosen Loops (letzte Sekunde blendet in den Anfang über)
name: Nahtlose Video-Loops
on:
  push:
    paths: ['.qa/request']
permissions:
  contents: write
jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          set -euo pipefail
          for v in */media/hero.mp4; do
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$v")
            off=$(python3 -c "print(round($d-2,3))")
            ffmpeg -nostdin -loglevel error -y -i "$v" -filter_complex \
              "[0:v]split[a][b];[a]trim=start=1,setpts=PTS-STARTPTS[main];[b]trim=0:1,setpts=PTS-STARTPTS[head];[main][head]xfade=transition=fade:duration=1:offset=$off,format=yuv420p[v]" \
              -map "[v]" -an -c:v libx264 -preset slow -crf 26 -movflags +faststart "$v.tmp.mp4"
            mv "$v.tmp.mp4" "$v"
            ffmpeg -nostdin -loglevel error -y -i "$v" -vf "fps=2,scale=320:-1,tile=8x1" -frames:v 1 ".qa/$(dirname "$(dirname "$v")")-loop.jpg"
            echo "$v: $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$v")s $(du -h "$v" | cut -f1)" >> .qa/loop.txt
          done
          git config user.name "github-actions[bot]"; git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "Hero-Videos als nahtlose Loops" && git push
