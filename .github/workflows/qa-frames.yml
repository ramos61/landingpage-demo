# Vorübergehend: Filmstreifen zur Qualitätskontrolle der Hero-Videos
name: QA-Filmstreifen
on:
  push:
    paths: ['.qa/request']
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          for v in bestatter/media/hero.mp4 haustechnik/media/hero.mp4; do
            ffmpeg -nostdin -loglevel error -y -i "$v" -vf "fps=2,scale=320:-1,tile=8x1" -frames:v 1 ".qa/$(dirname "$(dirname "$v")").jpg"
          done
          git config user.name "github-actions[bot]"; git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add .qa && git commit -m "QA-Filmstreifen" && git push
